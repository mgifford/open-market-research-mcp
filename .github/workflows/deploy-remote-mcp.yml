name: Deploy optional remote MCP Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: remote-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: remote-mcp
        run: npm ci --no-audit --no-fund
      - name: Test public research helpers
        working-directory: remote-mcp
        run: npm test && npm run check
      - name: Publish Worker (requires explicit repository secrets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: remote-mcp
          command: deploy
