name: Optional HF fictional demo
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Explicit Hugging Face Inference Providers model ID'
        required: true
        type: string

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate unverified demo summary
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL: ${{ inputs.model }}
        run: python scripts/hf_summarize.py
      - name: Upload result for human review (not Pages)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unverified-hf-demo
          path: _outputs/hf-demo-summary.json
          retention-days: 7
