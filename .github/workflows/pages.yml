name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python package and test dependencies
        run: python -m pip install '.[dev]'
      - name: Verify curated software snapshot
        run: python scripts/verify_catalog.py
      - name: Test deterministic research engine
        run: python -m pytest -q
      - name: Test browser research helpers
        run: node --test tests/research.test.mjs
      - name: Build Pages site from canonical project data
        run: python scripts/build_site.py
      - name: Verify expected site files
        run: |
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/research.js
          test -s _site/rules.js
          test -s _site/data/rules.json
          test -s _site/data/sources.json
          test -s _site/data/demo.json
          test -s _site/data/public-software.json
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site/

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Validate OpenACR fixture with the pinned upstream CLI
        run: npm run test:openacr
      - name: Run browser and accessibility regression tests
        run: npx playwright test
      - name: Upload accessibility evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, accessibility]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
