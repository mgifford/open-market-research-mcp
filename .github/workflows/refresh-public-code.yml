name: Reviewable public code.json snapshot
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch allowlisted public code.json entries
        run: python scripts/refresh_public_code.py
      - name: Validate source snapshot
        run: python scripts/verify_catalog.py
      - name: Save updated catalog for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-codejson-for-review
          path: data/public-software.json
          retention-days: 7
